version: '3.9'
services:
  zookeeper1:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka1:
    image: docker.arvancloud.ir/confluentinc/cp-kafka:7.3.3
    container_name: kafka1
    depends_on:
      - zookeeper1
    ports:
      - "2052:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.0.16.138:2052
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kafka-logs

  zookeeper2:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2181"

  kafka2:
    image: docker.arvancloud.ir/confluentinc/cp-kafka:7.3.3
    container_name: kafka2
    depends_on:
      - zookeeper2
    ports:
      - "2053:9092"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.0.16.138:2053
      KAFKA_ZOOKEEPER_CONNECT: zookeeper2:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kafka-logs

  zookeeper3:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2183:2181"

  kafka3:
    image: docker.arvancloud.ir/confluentinc/cp-kafka:7.3.3
    container_name: kafka3
    depends_on:
      - zookeeper3
    ports:
      - "2054:9092"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.0.16.138:2054
      KAFKA_ZOOKEEPER_CONNECT: zookeeper3:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kafka-logs

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "2022:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "kafka-cluster-2052"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:9092"
      KAFKA_CLUSTERS_1_NAME: "kafka-cluster-2053"
      KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: "kafka2:9092"
      KAFKA_CLUSTERS_2_NAME: "kafka-cluster-2054"
      KAFKA_CLUSTERS_2_BOOTSTRAPSERVERS: "kafka3:9092"
